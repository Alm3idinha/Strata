[project]
name = "strata"
version = "0.2.8"
description = "Local LLM server with OpenAI/Anthropic compatible API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Niko1221", email = "niko@strata.ai"}
]
maintainers = [
    {name = "Niko1221", email = "niko@strata.ai"}
]
keywords = ["llm", "inference", "api", "local", "server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jinja2>=3.1.6,<4.0.0",
    "regex>=2026.9.10,<2027.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "tqdm>=4.70.1,<5.0.0",
    "requests>=2.34.2,<3.0.0",
    "pillow>=13.0.0,<14.0.0",
    "psutil>=7.2.2,<8.0.0",
    "numpy>=2.4.6,<3.0.0; python_version == '3.11'",
    "numpy>=2.5.3,<3.0.0; python_version >= '3.12'",
    "markupsafe>=3.0.3,<4.0.0",
    "certifi>=2026.10.19,<2027.0.0",
    "truststore>=0.10.5,<1.0.0; python_version >= '3.10'",
    "charset-normalizer>=3.5.1,<4.0.0",
    "idna>=3.20,<4.0.0",
    "urllib3>=2.8.0,<3.0.0",
    "colorama>=0.4.6,<1.0.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = [
    "cmake>=4.4.3,<5.0.0",
    "ninja>=1.13.2,<2.0.0",
]
monitor = [
    "textual>=8.2.8,<9.0.0",
]
nvfp4 = [
    "torch>=2.9.1,<3.0.0; python_version < '3.14'",
    "torch>=2.14.1,<3.0.0; python_version >= '3.14'",
    "transformers>=4.57.6,<5.0.0",
    "safetensors>=0.7.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/Niko1221/Strata"
Repository = "https://github.com/Niko1221/Strata"
Issues = "https://github.com/Niko1221/Strata/issues"
Documentation = "https://github.com/Niko1221/Strata/tree/main/docs"

[build-system]
requires = ["setuptools>=84.1.0,<90.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pip-audit>=2.7.0,<3.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["serve", "tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["serve*", "strata_cli*", "strata_control*", "tools*"]

[tool.setuptools.package-dir]
"" = "."